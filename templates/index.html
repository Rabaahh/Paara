<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Drowsiness Detector</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <header>
        <h1>Student Drowsiness Detector</h1>
        <p>Real-time classroom monitoring</p>
    </header>


    <!-- START BUTTON -->

    <div class="start-section">

        <button id="start-button">
            ▶ START DETECTION
        </button>

        <p id="start-message">
            Press Start Detection to begin meme sounds.
        </p>

    </div>


    <!-- TWO CAMERA FEEDS -->

    <div class="camera-grid">

        <div class="camera-card">

            <h2>Normal Camera</h2>

            <div class="camera-container">
                <img src="{{ url_for('video_raw') }}"
                     alt="Normal camera feed">
            </div>

        </div>


        <div class="camera-card">

            <h2>Detection Camera</h2>

            <div class="camera-container">
                <img src="{{ url_for('video_detected') }}"
                     alt="Detection camera feed">
            </div>

            <div class="legend">

                <span>
                    <i class="green"></i>
                    Face
                </span>

                <span>
                    <i class="blue"></i>
                    Eyes
                </span>

                <span>
                    <i class="red"></i>
                    Nose
                </span>

                <span>
                    <i class="yellow"></i>
                    Mouth
                </span>

                <span>
                    <i class="pink"></i>
                    Body
                </span>

            </div>

        </div>

    </div>


    <!-- STATUS -->

    <h2 class="section-title">Detection Status</h2>

    <div class="status-grid">

        <div class="status-card">
            <h3>Face</h3>
            <p id="face-status">AWAKE</p>
        </div>

        <div class="status-card">
            <h3>Eyes</h3>
            <p id="eyes-status">OPEN</p>
        </div>

        <div class="status-card">
            <h3>Head</h3>
            <p id="head-status">NORMAL</p>
        </div>

        <div class="status-card">
            <h3>Body</h3>
            <p id="body-status">NORMAL</p>
        </div>

        <div class="status-card">
            <h3>Yawn</h3>
            <p id="yawn-status">NO YAWN</p>
        </div>

    </div>


    <div class="overall-card">

        <h2>Overall Status</h2>

        <p id="overall-status">AWAKE</p>

    </div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
